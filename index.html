<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Craft</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="zone"></div>
  <div id="cross"></div>
  <div id="fps"></div>
  <div id="blockname"></div>
  <div id="hotbar"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button class="gbtn touchui" id="btnJump" aria-label="Jump">▲</button>
  <button class="gbtn touchui" id="btnFly" aria-label="Fly">Fly</button>
  <button class="gbtn touchui" id="btnDown" aria-label="Down" hidden>Down</button>
  <button class="gbtn" id="btnMenu" aria-label="Menu">☰</button>
  <button class="gbtn" id="btnBag" aria-label="Bag">Bag</button>

  <div id="overlay">
    <div class="card">
      <h1>Open Craft</h1>
      <p id="err"></p>
      <button class="big" id="btnStart">Play</button>
      <button class="small" id="btnFs">Fullscreen</button>
      <button class="small" id="btnReset">New World</button>
      <button class="small" id="btnCredits">Credits &amp; Contributors</button>
    </div>
  </div>
  <div id="credits" hidden>
    <div class="card wide">
      <h1>Credits &amp; Contributors</h1>
      <p>Special thanks to everyone who contributed to this game.</p>
      <div id="creditList"></div>
      <button class="small" id="creditsClose">Back</button>
    </div>
  </div>
  <div id="bag" hidden>
    <div class="card">
      <h1>Bag</h1>
      <p>The block you pick goes into the selected slot of the bottom bar.</p>
      <div id="bagGrid"></div>
      <button class="small" id="bagClose">Close</button>
    </div>
  </div>
</div>

<script src="js/lib/three.min.js"></script>
<script src="js/data/tiles.js"></script>
<script src="js/data/pack2.js"></script>
<script src="js/data/credits.js"></script>
<script src="js/game.js"></script>
</body>
</html>
